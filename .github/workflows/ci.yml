# Verificación de cada cambio. Ver docs/traspaso.md §6.
# No despliega nada y no usa secretos: la base de datos de las pruebas es un Supabase
# local que levanta el propio runner con Docker.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, comprobación de tipos, pruebas unitarias (Vitest) y build de producción.
  app:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  # Pruebas unitarias de las Edge Functions con Deno 2 (sin red ni base de datos).
  funciones:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm run test:functions

  # Migraciones desde cero, pruebas pgTAP y verificación de que los tipos generados están al día.
  base-de-datos:
    name: Migraciones desde cero, pgTAP y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Solo Postgres: aplica las migraciones en orden sobre una base vacía.
      - run: supabase db start
      - run: supabase test db
      - run: npm ci
      - name: Comprobar que src/types/supabase.gen.ts está al día
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          npm run db:types
          if ! git diff --exit-code src/types/supabase.gen.ts; then
            echo "::error::src/types/supabase.gen.ts no coincide con las migraciones: corre npm run db:types y sube el archivo."
            exit 1
          fi
      - name: Comprobar que supabase/schema/actual.sql está al día
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          npm run db:schema
          if ! git diff --exit-code supabase/schema/actual.sql; then
            echo "::error::supabase/schema/actual.sql no coincide con las migraciones: corre npm run db:schema y sube el archivo."
            exit 1
          fi

  # Pruebas E2E (Playwright) y seguridad de la API (qa:security:local) contra el stack completo local.
  e2e:
    name: E2E y seguridad contra stack local
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Stack completo en los puertos de supabase/config.toml.
      - run: supabase start
      - run: npm run test:e2e:local
      - run: npm run qa:security:local
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
