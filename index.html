<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg?v=2" />
    <!-- App instalable (PWA). En iPhone, las notificaciones push solo existen
         para una app agregada a la pantalla de inicio, y eso requiere el
         manifiesto y el ícono táctil. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Restorify" />
    <!-- `viewport-fit=cover` es lo que hace que `env(safe-area-inset-*)` resuelva
         a algo distinto de 0. Sin él, el padding de área segura de la barra de
         navegación inferior era código muerto y la barra quedaba pegada al
         indicador de inicio del iPhone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- La letra de la app y del portal (la página de inicio trae las suyas). Con media="print" no
         detiene el primer pintado: se aplica al llegar. -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
    <!-- Fondo oscuro desde el primer pintado: los estilos llegan con el paquete de cada aplicación. -->
    <style>
      html:not([data-theme='light']) { background: #0a0a0a; }
      body { margin: 0; }
    </style>
    <!-- La raíz es la página del taller para el público (src/landing). Lo que sigue lo leen los
         buscadores y las vistas previas de WhatsApp y Facebook, que no ejecutan JavaScript. La app
         del taller pone su propio título y se marca como no indexable al arrancar (appStart.tsx).
         Si cambia un dato del taller, cámbialo también en src/landing/business.ts (lo compara
         src/landing/business.test.ts). -->
    <title>Restorify Auto | Collision repair, paint and mechanics in Hyattsville, MD</title>
    <meta name="description" content="Auto body shop in Hyattsville, MD: collision repair, paint and mechanics. We work with all insurance companies. English (240) 355-1266, Español (202) 607-6126." />
    <link rel="canonical" href="https://restorifyauto.net/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Restorify Auto" />
    <meta property="og:title" content="Restorify Auto | Repair. Restore. Perform." />
    <meta property="og:description" content="Collision repair, paint and mechanics in Hyattsville, MD. We work with all insurance companies." />
    <meta property="og:url" content="https://restorifyauto.net/" />
    <meta property="og:image" content="https://restorifyauto.net/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "AutoBodyShop",
        "name": "Restorify Auto",
        "url": "https://restorifyauto.net/",
        "logo": "https://restorifyauto.net/icons/icon-512.png",
        "image": "https://restorifyauto.net/og-image.jpg",
        "telephone": "+1-240-355-1266",
        "email": "restorifyauto@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "5010 46th Ave C",
          "addressLocality": "Hyattsville",
          "addressRegion": "MD",
          "postalCode": "20781",
          "addressCountry": "US"
        },
        "geo": { "@type": "GeoCoordinates", "latitude": 38.9518, "longitude": -76.9392 },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "09:00",
            "closes": "18:00"
          },
          { "@type": "OpeningHoursSpecification", "dayOfWeek": "Saturday", "opens": "09:00", "closes": "17:00" }
        ],
        "contactPoint": [
          { "@type": "ContactPoint", "telephone": "+1-240-355-1266", "contactType": "customer service", "availableLanguage": "English" },
          { "@type": "ContactPoint", "telephone": "+1-202-607-6126", "contactType": "customer service", "availableLanguage": "Spanish" },
          { "@type": "ContactPoint", "telephone": "+1-301-909-9937", "contactType": "customer service" }
        ],
        "sameAs": [
          "https://www.instagram.com/restorifyauto/",
          "https://www.facebook.com/RestorifyAuto/",
          "https://beacons.ai/restorify",
          "https://maps.google.com/maps?cid=6406593209024641082"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
